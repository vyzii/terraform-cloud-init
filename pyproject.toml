[project]
name = "terraform-cloud-init"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vyzii", email = "hharkdesigns@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tf-cloud-init = "terraform_cloud_init.main:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]